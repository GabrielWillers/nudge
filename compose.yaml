# Ambiente de DESENVOLVIMENTO do aplicativo: build local, recarga automática,
# portas expostas. **Não valida manifesto** — quem valida o estado declarado é
# o cluster kind da fase 5 (ADR-0008).

name: nudge

services:
  db:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nudge}
      POSTGRES_USER: ${POSTGRES_USER:-nudge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nudge} -d ${POSTGRES_DB:-nudge}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      target: dev
    environment:
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
      APP_COMMIT: ${APP_COMMIT:-local}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Só o que o processo precisa ver; o venv fica em /opt/venv, fora daqui.
      - ./app:/app/app
      - ./tests:/app/tests
      - ./alembic.ini:/app/alembic.ini
      - ./pyproject.toml:/app/pyproject.toml
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status
          == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
