[project]
name = "nudge"
version = "0.1.0"
description = "Lista compartilhada de lembretes — carga de trabalho da plataforma DevOps"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.116",
    "jinja2>=3.1",
    "prometheus-fastapi-instrumentator>=7.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["app/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = []
exclude = ["^app/migrations/"]

[[tool.mypy.overrides]]
module = ["prometheus_fastapi_instrumentator.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=70"
filterwarnings = ["error::DeprecationWarning:app.*"]
