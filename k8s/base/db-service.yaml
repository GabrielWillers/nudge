apiVersion: v1
kind: Service
metadata:
  name: nudge-db
  labels:
    app.kubernetes.io/name: nudge
    app.kubernetes.io/component: db
spec:
  # Headless: o StatefulSet precisa de identidade estável por pod, e o banco
  # não é balanceado. Sem exposição externa (ADR-0007).
  clusterIP: None
  selector:
    app.kubernetes.io/name: nudge
    app.kubernetes.io/component: db
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: postgres
