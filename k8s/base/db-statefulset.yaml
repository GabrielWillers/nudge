apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nudge-db
  labels:
    app.kubernetes.io/name: nudge
    app.kubernetes.io/component: db
spec:
  # Precisa casar com o nome do Service headless, senão o pod não ganha DNS.
  serviceName: nudge-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nudge
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nudge
        app.kubernetes.io/component: db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        # Faz o volume novo nascer pertencendo ao grupo do postgres; sem isso o
        # initdb não consegue escrever no PVC recém-criado.
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Nome do container é rótulo DNS: não aceita ':' nem '@'. A imagem vai
        # em `image`, fixada por digest como o resto do projeto.
        - name: postgres
          image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: nudge
            - name: POSTGRES_USER
              value: nudge
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nudge-db
                  key: postgres-password
            # O PVC é montado em /var/lib/postgresql/data e nasce com um
            # lost+found; o initdb recusa diretório não vazio. Daí o subdiretório.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "nudge", "-d", "nudge"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "nudge", "-d", "nudge"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 400Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
