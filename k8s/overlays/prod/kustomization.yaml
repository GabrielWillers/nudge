apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/gabrielwillers/nudge
    newTag: v1.0.0

patches:
  - target:
      kind: StatefulSet
      name: nudge-db
    patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: do-block-storage
