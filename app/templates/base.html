<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Declarado explicitamente: sem isso o navegador pede /favicon.ico na
         raiz, que não existe, e todo acesso deixa um 404 no log e na métrica. -->
    <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml" />
    <meta name="description" content="Lista compartilhada de lembretes." />
    <title>Nudge — lembretes</title>
    <!-- O endereço carrega o identificador de build: sem isso, o navegador
         pode servir o estilo antigo depois de um deploy, porque /static não
         manda Cache-Control e o cache heurístico decide sozinho. -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='/style.css') }}?v={{ version }}-{{ commit }}"
    />
  </head>
  <body>
    <header class="topo">
      <h1>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 1 0-12 0c0 6-3 7-3 7h18s-3-1-3-7" />
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
        </svg>
        Nudge
      </h1>
    </header>

    <main>{% block conteudo %}{% endblock %}</main>

    <footer class="rodape">
      <!-- Identificador de build: com o escopo congelado, é o único sinal
           observável de que um deploy aconteceu. -->
      versão <strong>{{ version }}</strong> · commit <code>{{ commit }}</code>
      · horários em {{ timezone }}
    </footer>
  </body>
</html>
